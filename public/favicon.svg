<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo laranja arredondado -->
  <rect width="32" height="32" rx="8" fill="#FF5A1F"/>
  
  <!-- Antena central -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="3.5" r="1.5" fill="white"/>
  
  <!-- Cabeça do robô -->
  <rect x="8" y="8" width="16" height="12" rx="3" fill="white"/>
  
  <!-- Olhos -->
  <circle cx="12.5" cy="13" r="2" fill="#FF5A1F"/>
  <circle cx="19.5" cy="13" r="2" fill="#FF5A1F"/>
  
  <!-- Brilho nos olhos -->
  <circle cx="13.3" cy="12.2" r="0.6" fill="white"/>
  <circle cx="20.3" cy="12.2" r="0.6" fill="white"/>
  
  <!-- Boca / sorriso -->
  <rect x="12" y="16.5" width="8" height="1.5" rx="0.75" fill="#FF5A1F" opacity="0.7"/>
  
  <!-- Corpo -->
  <rect x="10" y="22" width="12" height="7" rx="2" fill="white"/>
  
  <!-- Botão central no corpo -->
  <circle cx="16" cy="25.5" r="1.5" fill="#FF5A1F" opacity="0.8"/>
  
  <!-- Braços -->
  <rect x="4" y="22" width="4.5" height="5" rx="2" fill="white"/>
  <rect x="23.5" y="22" width="4.5" height="5" rx="2" fill="white"/>
</svg>
